<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/78c36cf674.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="main.js"></script>
    <title>Podsearch - Settings</title>
</head>
<body>
    <!-- Navbar -->
    <div class="head">
        <div class="Logo">
            <figure>
                <a href="index.html">
                    <img src="Assets/Logo.png" alt="Podsearch Logo">
                </a>
            </figure>
        </div>

        <nav class="navbar"> 
            <a href="index.html">Start</a>
            <a href="categories.html">Categories</a>
            <a href="settings.html">Settings</a>
            <a href="aboutUs.html">About us</a> 
            <a href="login.html">Login</a>
        </nav>
    </div>

    <!-- Main Content -->
    <section class="main content">
        <div class="settings-container">
            <div class="settings-image">
                <img src="Assets/homepage-background.jpg" alt="podcast">
            </div>
            <div class="settings-section">
                <h3>Preferences</h3>

                <!-- Theme toggle -->
                <div class="theme-toggle">
                    <label class="switch">
                        <input type="checkbox" id="switch">
                        <span class="slider round"></span>
                    </label>
                    <span class="theme-text">Dark Mode</span>
                </div>

                <!-- Language selection -->
                <div class="language-selection">
                    <label for="language">Language:</label>
                    <select id="language" name="language">
                        <option value="english">English</option>
                        <option value="spanish">Spanish</option>
                        <option value="french">French</option>
                    </select>
                </div>

                <!-- Save button -->
                <button class="save-button">Save</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="group-1">
            <div class="box">
                <figure>
                    <a href="#">
                        <img src="Assets/Logo.png" alt="testlogo">
                    </a>
                </figure>
            </div>
            <div class="box">
                <h2>About Us</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat, laudantium?</p>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugiat, laudantium?</p>
            </div>
            <div class="box">
                <h2>Social Networks</h2>
                <div class="social-net">
                    <a href="#" class="fa fa-facebook"></a>
                    <a href="#" class="fa fa-instagram"></a>
                    <a href="#" class="fa fa-twitter"></a>
                    <a href="#" class="fa fa-youtube"></a>
                </div>
            </div>
        </div>
        <div class="group-2">
            <small>&copy; 2024 <b>Podsearch</b> - All Rights reserved </small>
        </div>
    </footer>
</body>
</html>
